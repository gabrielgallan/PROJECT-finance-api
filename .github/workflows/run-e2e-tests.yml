name: Run E2E Tests

on:
  pull_request:

jobs:
  run-e2e-tests:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://docker:docker@localhost:5432/valora?schema=public
      REDIS_URL: redis://localhost:6379/0
      JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
      JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
      GITHUB_OAUTH_CLIENT_ID: dummy
      GITHUB_OAUTH_CLIENT_SECRET: dummy
      GITHUB_OAUTH_CLIENT_REDIRECT_URI: https://example.com/callback
      RESEND_API_KEY: dummy
      CLOUDINARY_CLOUD_NAME: dummy
      CLOUDINARY_API_KEY: dummy
      CLOUDINARY_API_SECRET: dummy
      FRONTEND_BASE_URL: https://example.com

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: docker
          POSTGRES_PASSWORD: docker
          POSTGRES_DB: valora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docker -d valora"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - run: pnpm install --frozen-lockfile

      - run: pnpm prisma generate

      - run: pnpm test:e2e
